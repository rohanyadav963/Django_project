{% extends "adminbase.html" %}
{% load static %}
{% block admin %}
<div class="row">
    <div class="col-sm-6 mx-auto my-5">
        <div class="card p-4 shadow">
            <h3 class="mx-auto mb-3 text-primary">Add Department</h3>
            <form method="post" class="form-input ">
                {% csrf_token %}
            <label for="dept" class="form-label my-2 fw-bold">Department</label>
            <input type="text" class="form-control fw-bold " name="dept_name" id="dept" placeholder="Department">
            <button type="submit" class="btn btn-primary fw-bold my-2">Add</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
