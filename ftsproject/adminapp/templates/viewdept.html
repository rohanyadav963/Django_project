{% extends "adminbase.html" %}
{% load static %}
{% block admin %}
<div class="row ">
    <div class="col-sm-6 mx-auto ">
        
            <table class="table table-hover bg-white rounded-3 shadow-lg text-center">
                <tr>
                    <th>Sr.no</th>
                    <th>Department Name</th>
                    <th>Action</th>
                </tr>
                {% for d in depts %}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{d.dept_name}}</td>
                    <td><a href="{% url 'deldept' did=d.id %}" class="btn btn-danger"><i class="ti ti-trash"></i></a></td>
                </tr>
                {% endfor %}
            </table>
    </div>
</div>

{% endblock %}
